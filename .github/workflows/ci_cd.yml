name: 🔄 CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 'CI-CD - ${{ github.workflow }} @ ${{ github.ref_name }}'
  cancel-in-progress: true

jobs:
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Linters and Static Analysis
        run: |
          chmod +x scripts/precommit.sh
          ./scripts/precommit.sh

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. pytest -m infrastructure
          ls -l latency_report.png performance_summary.png summary_stats.json

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-test-reports
          path: |
            latency_report.png
            performance_summary.png
            summary_stats.json
          if-no-files-found: ignore

  build-and-push:
    name: 🏗️ Build & Push Image
    needs: [static-analysis, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  validation-tests:
    name: 🧪 Validation Tests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Validation Tests in Docker
        run: |
          # We need to mount the current directory to collect the artifacts generated inside the container
          # We also ensure the runner user has permissions to the workspace files created by the container
          docker run --rm -v ${{ github.workspace }}:/app_output ghcr.io/${{ github.repository }}:latest bash -c "pytest -m 'not infrastructure' && cp latency_report.png performance_summary.png summary_stats.json /app_output/ && chmod 666 /app_output/latency_report.png /app_output/performance_summary.png /app_output/summary_stats.json"
          ls -l latency_report.png performance_summary.png summary_stats.json

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-reports
          path: |
            latency_report.png
            performance_summary.png
            summary_stats.json
          if-no-files-found: warn
