[pytest]
python_files = tests.py test_*.py *_tests.py
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
addopts = -vv --setup-show
markers =
    radar: tests related to radar KPIs
    camera: tests related to camera KPIs
    fusion: tests related to fusion KPIs
    additional: tests related to all additional KPIs (group marker)
    stability: tests related to confidence stability KPI
    contribution: tests related to sensor contribution balance KPI
    spatial: tests related to spatial alignment error KPI
    infrastructure: tests related to core logic and data loading (unit tests)
